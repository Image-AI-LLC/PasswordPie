<form id="signup">
  <h2>Create account</h2>
  <input id="signup-email" type="email" autocomplete="email">
  <input id="signup-pass" type="password" autocomplete="new-password">
  <input id="signup-confirm" type="password" autocomplete="new-password">
</form>
<form id="signin">
  <h2>Sign in</h2>
  <input id="signin-email" type="email" autocomplete="username">
  <input id="signin-pass" type="password">
</form>
